
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Monster Adventure</title>
  <style>
    body {
      margin: 0;
      font-family: monospace;
      text-align: center;
      background: #b7e8a5;
      color: #203d2b;
    }
    h1 { background: #347b48; color: white; padding: 18px; margin: 0; }
    main { max-width: 500px; margin: 20px auto; padding: 15px; }
    .field {
      background: #6abf69;
      border: 5px solid #347b48;
      border-radius: 12px;
      padding: 24px 10px;
      min-height: 150px;
    }
    #creature { font-size: 75px; margin: 12px; }
    button {
      font: bold 16px monospace;
      padding: 12px 16px;
      margin: 6px;
      border: 3px solid #347b48;
      border-radius: 8px;
      background: #fff5c4;
      cursor: pointer;
    }
    button:hover { background: #ffe477; }
    .panel {
      background: #f4ffe9;
      border: 3px solid #347b48;
      border-radius: 10px;
      margin-top: 15px;
      padding: 12px;
    }
    #message { min-height: 40px; font-size: 15px; }
  </style>
</head>
<body>

<h1>🌿 Mini Monster Adventure 🌿</h1>

<main>
  <div class="field">
    <div>Wild grass is rustling...</div>
    <div id="creature">🌱</div>
    <h2 id="name">Green Meadow</h2>
    <div id="hp">Explore to find a creature!</div>
  </div>

  <div>
    <button onclick="explore()">🌿 Explore</button>
    <button onclick="catchCreature()">🔴 Catch</button>
    <button onclick="battle()">⚔️ Battle</button>
  </div>

  <div class="panel">
    <h3>📣 Adventure</h3>
    <p id="message">Welcome! Explore the grass to begin.</p>
  </div>

  <div class="panel">
    <h3>🎒 Your Team</h3>
    <p id="team">No creatures yet!</p>
    <p id="count">Caught: 0</p>
  </div>
</main>

<script>
  const wildCreatures = [
    { name: "Leafy", emoji: "🌿", hp: 20 },
    { name: "Flameling", emoji: "🔥", hp: 25 },
    { name: "Bubbloon", emoji: "💧", hp: 22 },
    { name: "Sparky", emoji: "⚡", hp: 18 },
    { name: "Rocko", emoji: "🪨", hp: 30 },
    { name: "Mushbud", emoji: "🍄", hp: 24 }
  ];

  let team = [];
  let wild = null;
  let found = false;

  function explore() {
    if (found) {
      document.getElementById("message").textContent =
              "A wild creature is already here! Catch it or battle it.";
      return;
    }

    if (Math.random() < 0.25) {
      document.getElementById("creature").textContent = "🌱";
      document.getElementById("name").textContent = "Quiet Meadow";
      document.getElementById("hp").textContent = "No creatures appeared.";
      document.getElementById("message").textContent =
              "Nothing appeared. Try exploring again!";
      return;
    }

    wild = { ...wildCreatures[Math.floor(Math.random() * wildCreatures.length)] };
    found = true;
    document.getElementById("creature").textContent = wild.emoji;
    document.getElementById("name").textContent = "Wild " + wild.name;
    document.getElementById("hp").textContent = "HP: " + wild.hp;
    document.getElementById("message").textContent =
            "A wild " + wild.name + " appeared! Try catching it!";
  }

  function catchCreature() {
    if (!found || !wild) {
      document.getElementById("message").textContent =
              "Explore first to find a wild creature!";
      return;
    }

    if (Math.random() < 0.7) {
      team.push(wild);
      document.getElementById("message").textContent =
              "Gotcha! " + wild.name + " joined your team!";
      updateTeam();
      found = false;
      wild = null;
      document.getElementById("creature").textContent = "✨";
      document.getElementById("name").textContent = "Success!";
      document.getElementById("hp").textContent = "Ready for another adventure!";
    } else {
      document.getElementById("message").textContent =
              wild.name + " escaped the capture ball! Try again!";
    }
  }

  function battle() {
    if (!found || !wild) {
      document.getElementById("message").textContent =
              "Find a wild creature before battling!";
      return;
    }

    if (team.length === 0) {
      document.getElementById("message").textContent =
              "You need to catch a creature first!";
      return;
    }

    let damage = Math.floor(Math.random() * 10) + 6;
    wild.hp -= damage;

    if (wild.hp <= 0) {
      document.getElementById("message").textContent =
              "You won! " + wild.name + " ran away. Explore for another!";
      found = false;
      wild = null;
      document.getElementById("creature").textContent = "🏆";
      document.getElementById("name").textContent = "Victory!";
      document.getElementById("hp").textContent = "You won the battle!";
    } else {
      document.getElementById("hp").textContent = "HP: " + wild.hp;
      document.getElementById("message").textContent =
              "Your team attacked for " + damage + " damage!";
    }
  }

  function updateTeam() {
    document.getElementById("team").textContent =
            team.map(c => c.emoji + " " + c.name).join(" · ");
    document.getElementById("count").textContent =
            "Caught: " + team.length;
  }
</script>

</body>
</html>
